<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#7028a8">

  <title>پنل مدیریت | رستوران قائم</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      font-family: "Vazirmatn", Tahoma, sans-serif;

      background: #f6f3fa;

      color: #282033;

    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .topbar {

      background: linear-gradient(135deg, #512078, #853bd0);

      color: white;

      padding: 22px max(18px, calc((100% - 1100px)/2));

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

    }

    .topbar h1 { margin: 0; font-size: 21px; }

    .topbar p { margin: 5px 0 0; font-size: 13px; opacity: .85; }

    main { max-width: 1100px; margin: 28px auto; padding: 0 16px; }

    .panel {

      background: white;

      padding: 24px;

      border-radius: 20px;

      box-shadow: 0 8px 35px #38204d0c;

      margin-bottom: 20px;

    }

    .login-panel { max-width: 440px; margin: 55px auto; }

    h2 { font-size: 19px; margin: 0 0 18px; }

    label { display: block; font-size: 14px; margin: 14px 0 7px; }

    input {

      width: 100%; min-width: 0; padding: 12px 14px;

      border: 1px solid #ded5e8; border-radius: 11px;

      background: #fff; outline: none;

    }

    input:focus { border-color: #853bd0; box-shadow: 0 0 0 3px #853bd018; }

    .btn {

      border: 0; border-radius: 11px; padding: 11px 16px;

      background: #7028a8; color: white; font-weight: 700;

    }

    .btn:hover { background: #572080; }

    .btn:disabled { opacity: .6; cursor: wait; }

    .btn-light { background: #f0e7f8; color: #61248f; }

    .btn-light:hover { background: #e5d5f3; }

    .btn-danger { background: #a52e50; }

    .full { width: 100%; margin-top: 20px; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

    .toolbar h2 { margin: 0; }

    .muted { color: #786e83; font-size: 13px; }

    .message { margin-top: 14px; font-size: 13px; line-height: 1.9; overflow-wrap: anywhere; }

    .message.error { color: #b42343; }

    .message.success { color: #167448; }

    .hidden { display: none !important; }

    .food-list { display: grid; gap: 14px; margin-top: 20px; }

    .food-card {

      display: grid; grid-template-columns: 90px minmax(0, 1fr);

      gap: 16px; padding: 16px; border: 1px solid #eee7f4;

      border-radius: 16px;

    }

    .food-card img {

      width: 90px; height: 90px; object-fit: cover;

      border-radius: 13px; background: #f3edf8;

    }

    .food-name { font-weight: 800; margin: 2px 0 4px; }

    .food-category { font-size: 12px; color: #84748f; margin-bottom: 12px; }

    .fields { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }

    .fields label { margin-top: 0; }

    .fields input { margin-top: 7px; }

    .food-actions { display: flex; justify-content: flex-start; gap: 9px; margin-top: 12px; flex-wrap: wrap; }

    .food-actions .btn { font-size: 13px; }

    .empty { text-align: center; padding: 30px; color: #786e83; }

    @media (max-width: 560px) {

      .panel { padding: 18px; }

      .food-card { grid-template-columns: 66px minmax(0, 1fr); gap: 12px; padding: 12px; }

      .food-card img { width: 66px; height: 66px; }

      .fields { grid-template-columns: 1fr; }

      .topbar h1 { font-size: 17px; }

    }

  </style>

</head>

<body>

  <header class="topbar">

    <div>

      <h1>پنل مدیریت رستوران قائم</h1>

      <p>مدیریت قیمت و تصاویر منوی دیجیتال</p>

    </div>

    <button id="logoutButton" class="btn btn-light hidden" type="button">خروج از پنل</button>

  </header>

  <main>

    <section id="loginPanel" class="panel login-panel">

      <h2>ورود مدیر</h2>

      <p class="muted">برای مدیریت منو، اطلاعات حساب مدیر را وارد کن.</p>

      <form id="loginForm">

        <label for="username">نام کاربری</label>

        <input id="username" name="username" autocomplete="username" required>

        <label for="password">رمز عبور</label>

        <input id="password" name="password" type="password"

               autocomplete="current-password" required>

        <button id="loginButton" class="btn full" type="submit">ورود به پنل</button>

      </form>

      <div id="loginMessage" class="message" role="status"></div>

    </section>

    <section id="dashboard" class="hidden">

      <div class="panel">

        <div class="toolbar">

          <div>

            <h2>مدیریت غذاها</h2>

            <p class="muted">قیمت و آدرس تصویر را ویرایش کن و ذخیره بزن.</p>

          </div>

          <button id="refreshButton" class="btn btn-light" type="button">بارگذاری دوباره</button>

        </div>

        <div id="dashboardMessage" class="message" role="status"></div>

        <div id="foodList" class="food-list"></div>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script src="admin.js"></script>
  </body>

</html>
